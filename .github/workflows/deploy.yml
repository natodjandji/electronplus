# Production deploys, started by hand (from the Actions tab, or by Claude
# through the GitHub API) — never on push. Runs scripts/deploy.sh with the
# service account key that `firebase init hosting:github` stored as a repo
# secret, so no key ever has to leave GitHub.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        required: true
        options:
          - check
          - api
          - web
          - rules

permissions:
  contents: read

# One deploy at a time; a second one waits instead of racing the first.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.target }} (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: google-github-actions/setup-gcloud@v2

      # The checks for the part being deployed; a failing one stops it.
      - name: Check API
        if: inputs.target == 'api'
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit -p tsconfig.json
          npx eslint "src/**/*.ts"
          npx jest

      - name: Check storefront
        if: inputs.target == 'web'
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npx eslint .
          npx vitest run

      - name: Deploy
        run: scripts/deploy.sh "${{ inputs.target }}"
        env:
          GCP_SA_KEY_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ELECTRONPLUS_VE }}
          # Public values the storefront is built with — repository
          # variables (Settings → Secrets and variables → Actions → Variables).
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_PAYPAL_CLIENT_ID: ${{ vars.VITE_PAYPAL_CLIENT_ID }}
          VITE_PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL }}
