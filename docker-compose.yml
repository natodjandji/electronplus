version: "3.9"

# Firestore/Firebase Auth are hosted services (project electronplus-ve) —
# only Redis (BullMQ queues) needs to run locally.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
